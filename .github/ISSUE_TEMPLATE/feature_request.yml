name: Feature request
description: An idea to make Hablo better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do
      description: The situation and what is missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: It works without the network and without new dependencies, or I explain why it cannot.
