name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Terminal
        - Terminal, fullscreen layout
        - Desktop app
        - VS Code extension
        - Other
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
      placeholder: 2.1.292 (Claude Code)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.1
    validations:
      required: true
  - type: textarea
    id: voices
    attributes:
      label: Output of /speak voices
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Messages from Hablo
      description: Any line or toast that starts with `hablo:`. Running `claude --debug` adds more detail.
      render: text
